name: Release portable bundles

# Builds the self-contained "run after extraction" bundle (packaging/build-bundle.mjs) for every supported
# platform and attaches the archives to the GitHub Release for the pushed tag. All five platforms are
# cross-packaged from an ubuntu-latest runner: the app is pure JS (no native build step at bundle time —
# better-sqlite3 is removed, the bundle uses node:sqlite) and the Node runtime is simply downloaded
# prebuilt for the target platform, so no macOS/Windows runners are needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux-x64, linux-arm64, darwin-x64, darwin-arm64, win-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (TypeScript project references + web SPA)
        run: npm run build

      - name: Build bundle for ${{ matrix.platform }}
        run: node packaging/build-bundle.mjs --platform ${{ matrix.platform }} --out dist-bundle

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: invest-monitor-${{ matrix.platform }}
          path: |
            dist-bundle/*.tar.gz
            dist-bundle/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts into one release directory
        run: |
          mkdir -p release
          find artifacts -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
